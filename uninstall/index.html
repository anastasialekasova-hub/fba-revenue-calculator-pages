<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBA Revenue Calculator was removed</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect x=%271%27 y=%271%27 width=%2718%27 height=%2718%27 rx=%275%27 fill=%27%23248fcc%27/%3E%3Crect x=%275.5%27 y=%274.5%27 width=%279%27 height=%273%27 rx=%271%27 fill=%27%23faf8f6%27/%3E%3Cg fill=%27%23faf8f6%27%3E%3Ccircle cx=%276.6%27 cy=%2710.6%27 r=%271.1%27/%3E%3Ccircle cx=%2710%27 cy=%2710.6%27 r=%271.1%27/%3E%3Ccircle cx=%2713.4%27 cy=%2710.6%27 r=%271.1%27/%3E%3Ccircle cx=%276.6%27 cy=%2714.2%27 r=%271.1%27/%3E%3Ccircle cx=%2710%27 cy=%2714.2%27 r=%271.1%27/%3E%3Ccircle cx=%2713.4%27 cy=%2714.2%27 r=%271.1%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script defer src="https://cloud.umami.is/script.js" data-website-id="328e350f-b770-4529-9500-92b514123a6c"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  body {
    background: #1b1815; color: #f2ece2;
    font: 17px/1.55 "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    font-synthesis: none; overflow-x: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  .shell { max-width: 640px; margin: 0 auto; padding: 56px 24px 80px; }

  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 36px; }
  .mark { display: flex; flex: 0 0 auto; }
  .mark svg { width: 34px; height: 34px; display: block; }
  .brand b { font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

  .q { display: block; font-size: 14px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #e8a33d; }
  legend.q { padding: 0; margin-bottom: 14px; }
  .options { display: flex; flex-direction: column; gap: 10px; border: 0; padding: 0; min-width: 0; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 12px;
    border: 1px solid #3a332c; border-radius: 12px; background: #262220;
    padding: 14px 16px; font-size: 16.5px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: #5a5148; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #5a5148; flex: none; transition: border-color .15s ease; }
  .opt:has(input:checked) { border-color: #e8a33d; background: #2c2620; }
  .opt:has(input:checked) .dot { border: 6px solid #e8a33d; }
  .opt:has(input:focus-visible) { outline: 2px solid #e8a33d; outline-offset: 2px; }

  .q2 { margin-top: 28px; }
  textarea {
    display: block; margin-top: 14px; width: 100%; min-height: 96px; resize: vertical;
    border: 1px solid #3a332c; border-radius: 12px; background: #262220;
    padding: 13px 16px; font-size: 16px; line-height: 1.5;
  }
  textarea::placeholder { color: #8f867a; }
  textarea:focus-visible { outline: 2px solid #e8a33d; outline-offset: 1px; border-color: #e8a33d; }

  .send {
    margin-top: 24px; padding: 14px 28px; border: 0; border-radius: 12px;
    background: #e8a33d; color: #1b1815; font-size: 17px; font-weight: 700; cursor: pointer;
  }
  .send:hover { background: #f0b254; }
  .send:focus-visible { outline: 2px solid #f2ece2; outline-offset: 3px; }

  .note { margin-top: 28px; font-size: 14px; color: #8f867a; max-width: 56ch; }
  .note a { color: #b3a996; }

  .thanks { display: none; margin-top: 16px; }
  .thanks h2 { font-size: 26px; letter-spacing: -0.01em; }
  .thanks p { margin-top: 10px; color: #b3a996; max-width: 52ch; }
  body[data-sent="true"] form { display: none; }
  body[data-sent="true"] .thanks { display: block; }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="5" fill="#248fcc"/><rect x="5.5" y="4.5" width="9" height="3" rx="1" fill="#faf8f6"/><g fill="#faf8f6"><circle cx="6.6" cy="10.6" r="1.1"/><circle cx="10" cy="10.6" r="1.1"/><circle cx="13.4" cy="10.6" r="1.1"/><circle cx="6.6" cy="14.2" r="1.1"/><circle cx="10" cy="14.2" r="1.1"/><circle cx="13.4" cy="14.2" r="1.1"/></g></svg></span>
      <b>FBA Revenue Calculator</b>
    </div>

    <form id="feedback">
      <fieldset class="options">
        <legend class="q">Why did you remove it?</legend>
        <label class="opt"><input type="radio" name="reason" value="The fees didn't match Amazon's own calculator"><span class="dot"></span>The fees didn't match Amazon's own calculator</label>
        <label class="opt"><input type="radio" name="reason" value="The card didn't show up on product pages"><span class="dot"></span>The card didn't show up on product pages</label>
        <label class="opt"><input type="radio" name="reason" value="I sell on a marketplace other than the US or UK"><span class="dot"></span>I sell on a marketplace other than the US or UK</label>
        <label class="opt"><input type="radio" name="reason" value="The card got in the way on Amazon pages"><span class="dot"></span>The card got in the way on Amazon pages</label>
      </fieldset>

      <label class="q q2" for="details">Anything else?</label>
      <textarea id="details" name="details" placeholder="Optional — what happened, or what you expected"></textarea>

      <button class="send" type="submit">Send feedback</button>
    </form>

    <div class="thanks" role="status">
      <h2>Thank you. Every answer counts.</h2>
      <p>Your answer helps us decide what to fix first.</p>
    </div>

    <p class="note">Everything the extension saved — your costs and settings — was stored only in your browser and was deleted with it. Prefer a conversation? <a href="https://github.com/anastasialekasova-hub/fba-revenue-calculator-pages/issues" target="_blank" rel="noopener">Open an issue on GitHub</a>.</p>
  </div>

<script>
  // Responses land in a Google Form. FORM_ID and the entry ids are filled in
  // once the form exists; while they are empty, the button only shows the thank-you state.
  var FORM_ID = '';
  var ENTRY_REASON = '';
  var ENTRY_DETAILS = '';

  document.getElementById('feedback').addEventListener('submit', function (e) {
    e.preventDefault();
    var reason = (document.querySelector('input[name="reason"]:checked') || {}).value || '';
    var details = document.querySelector('textarea[name="details"]').value.trim();

    if (FORM_ID && (reason || details)) {
      var data = new FormData();
      if (ENTRY_REASON && reason) data.append(ENTRY_REASON, reason);
      if (ENTRY_DETAILS && details) data.append(ENTRY_DETAILS, details);
      fetch('https://docs.google.com/forms/d/e/' + FORM_ID + '/formResponse',
        { method: 'POST', mode: 'no-cors', body: data }).catch(function () {});
    }
    document.body.dataset.sent = 'true';
  });
</script>
</body>
</html>
